name: API CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run tests
        run: npm test

  e2e:
    name: MongoDB workflows
    # Keep the CI runner image stable across ubuntu-latest updates.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Let glibc register rseq so MongoDB uses per-thread allocator caches.
      # This avoids the per-CPU cache incompatibility in SERVER-121912.
      - name: Start MongoDB replica set
        run: |
          docker run --detach \
            --name node-api-mongodb \
            --env GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            --publish 27017:27017 \
            mongo:8.0 \
            --replSet rs0 \
            --bind_ip_all

          # Probe the TCP listener before starting mongosh: its telemetry files
          # can otherwise race the entrypoint's initial ownership scan.
          for attempt in {1..30}; do
            if docker exec node-api-mongodb \
              bash -c 'true > /dev/tcp/127.0.0.1/27017' > /dev/null 2>&1 && \
              docker exec node-api-mongodb \
              mongosh --quiet --eval \
              'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)' > /dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs node-api-mongodb
              exit 1
            fi

            sleep 2
          done

          docker exec node-api-mongodb \
            mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'

          for attempt in {1..30}; do
            if docker exec node-api-mongodb \
              mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)' > /dev/null 2>&1; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs node-api-mongodb
              exit 1
            fi

            sleep 2
          done

      - name: Run workflows and enforce coverage
        env:
          TEST_DB_URL: mongodb://127.0.0.1:27017/account_api_test?replicaSet=rs0
        run: npm run test:coverage:all
